name: Verify Releases
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify (defaults to unverified releases from the last 14 days)'
        required: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Verify Releases
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
      - name: Install dependencies
        run: composer --no-interaction --no-ansi --no-progress update -d dev
      - name: Verify releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          CUTOFF=$(date -u -d "-14 days" +"%Y-%m-%dT%H:%M:%SZ")
          TAGS=${RELEASE_TAG:-$(gh api "repos/$GH_REPO/releases?per_page=20" | jq -r --arg cutoff "$CUTOFF" '.[] | select(.published_at >= $cutoff and ((.body // "") | contains("## Release Verification: ✅ Verified") | not)) | .tag_name')}
          FAILED=0
          for TAG in $TAGS; do
            TITLE="Release verification failed: $TAG"
            if ./dev/google-cloud release:verify "$TAG" --update-release -t "$GH_TOKEN"; then
              if [ "$GITHUB_REF" = "refs/heads/main" ]; then
                OPEN_ISSUE=$(gh issue list --repo "$GH_REPO" --search "\"$TITLE\" in:title" --state open --json number,title | jq -r --arg title "$TITLE" 'first(.[] | select(.title == $title) | .number) // empty')
                if [ -n "$OPEN_ISSUE" ]; then
                  IS_VERIFIED=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '(.body // "") | contains("## Release Verification: ✅ Verified")')
                  if [ "$IS_VERIFIED" = "true" ]; then
                    gh issue close "$OPEN_ISSUE" --repo "$GH_REPO" --comment "Release $TAG is now verified. Workflow Run: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
                  fi
                fi
              fi
            else
              FAILED=1
              if [ "$GITHUB_REF" = "refs/heads/main" ]; then
                EXISTING_ISSUE=$(gh issue list --repo "$GH_REPO" --search "\"$TITLE\" in:title" --state all --json number,title | jq -r --arg title "$TITLE" 'first(.[] | select(.title == $title) | .number) // empty')
                if [ -z "$EXISTING_ISSUE" ]; then
                  BODY=$(printf '`release:verify` failed for release %s.\n\n- Release: %s/%s/releases/tag/%s\n- Workflow Run: %s/%s/actions/runs/%s\n\n@googleapis/cloud-sdk-php-team' \
                    "$TAG" "$GITHUB_SERVER_URL" "$GH_REPO" "$TAG" "$GITHUB_SERVER_URL" "$GH_REPO" "$GITHUB_RUN_ID")
                  gh issue create \
                    --repo "$GH_REPO" \
                    --title "$TITLE" \
                    --label ":rotating_light: critical" \
                    --body "$BODY"
                else
                  echo "Issue #$EXISTING_ISSUE already exists for $TAG; skipping."
                fi
              fi
            fi
          done
          exit $FAILED
