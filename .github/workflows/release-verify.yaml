name: Verify Releases
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to verify (defaults to unverified releases from the last 14 days)'
        required: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Verify Releases
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
      - name: Install dependencies
        run: composer --no-interaction --no-ansi --no-progress update -d dev
      - name: Verify releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          CUTOFF=$(date -u -d "-14 days" +"%Y-%m-%dT%H:%M:%SZ")
          TAGS=${RELEASE_TAG:-$(gh api "repos/$GH_REPO/releases?per_page=20" --jq ".[] | select(.published_at >= \"$CUTOFF\" and ((.body // \"\") | contains(\"## Release Verification: ✅ Verified\") | not)) | .tag_name")}
          FAILED=0
          for TAG in $TAGS; do
            ./dev/google-cloud release:verify "$TAG" --update-release -t "$GH_TOKEN" || FAILED=1
          done
          exit $FAILED
      - name: Create issue if previous step fails
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        uses: googleapis/librarian/.github/actions/create-issue-on-failure@b20d5aacda59661432a57ef0e626edfdec07a39b # v1.0.1
        with:
          title: "Release verification failed"
          body: |
            `release:verify` failed for a recent release.

            Please check the logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          mention: "@googleapis/cloud-sdk-php-team"
