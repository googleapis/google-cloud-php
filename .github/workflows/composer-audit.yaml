name: Composer Audit
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  composer-audit:
    runs-on: ubuntu-latest
    name: Composer Audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
      - name: Install dependencies
        run: |
          composer --no-interaction --no-ansi --no-progress update
          composer --no-interaction --no-ansi --no-progress update -d dev
      - name: Audit dependencies
        run: |
          composer audit --abandoned=fail
          composer audit --abandoned=fail -d dev
      - name: Create issue if previous step fails
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        uses: googleapis/librarian/.github/actions/create-issue-on-failure@12a22e42421675219c659a288446a5306da919d5 # v0.48.0
        with:
          title: "Composer Audit check failed on main branch"
          body: |
            The scheduled `composer audit --abandoned=fail` check failed on `main` branch due to a security advisory or abandoned package.

            Please check the logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          mention: "@googleapis/cloud-sdk-php-team"
