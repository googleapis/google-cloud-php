---
name: Librarian Generation Check
on:
  push:
    branches:
      - main
  # Allows manual triggering for debugging purpose.
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  regeneration:
    name: "Librarian: Generation Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Version of librarian is pulled from librarian.yaml, action version will not affect librarian version
      # and is pinned to commit SHA to satisfy blanket security policy.
      - uses: googleapis/librarian@c1ec41aa4521e7dd6ac2aba480457bbb2d61c2ef # v0.50.0
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ^7.0.0
      - name: Install tools
        run: librarian install
      - name: Regenerate
        run: |
          librarian generate --all
          if [ -n "$(git status --porcelain)" ]; then
            git status
            echo "==================== GIT DIFF ===================="
            git diff
            echo "=================================================="
            echo "Regeneration failed. Please run 'librarian generate --all' to update the generated files."
            exit 1
          fi
      - name: Create issue if previous step fails
        if: ${{ failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: googleapis/librarian/.github/actions/create-issue-on-failure@c1ec41aa4521e7dd6ac2aba480457bbb2d61c2ef # v0.50.0
        with:
          title: "Librarian generate diff check failed on main branch"
          body: |
            The librarian generate diff check failed on main branch.

            To keep the `main` branch healthy, please consider **reverting the triggering change** first. Once the revert is merged, you can investigate the failure and submit a new PR with the fix.

            Please check the logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}