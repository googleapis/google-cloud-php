name: Release Checks
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: ['main']
permissions:
  contents: read
jobs:
  # More info at https://github.com/Roave/BackwardCompatibilityCheck.
  backwards-compatibility-check:
    name: Breaking Change Detector
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.body, 'BREAKING_CHANGE_REASON=') }}
    # Overrides the workflow default so the release PR report can be commented.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "Install PHP"
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
      - name: "Install dependencies"
        run: composer global require "roave/backward-compatibility-check:^8.22"
      - name: "Check for BC breaks"
        if: github.event.pull_request.user.login != 'release-please[bot]'
        run: |
          git config --global user.name "Github Actions"
          git config --global user.email "actions@github.com"

          BASE_REF=$(git merge-base origin/main HEAD)

          # Find changed components. Every top-level CamelCase directory is a component.
          CHANGED_COMPONENTS=$(git diff "${BASE_REF}" --name-only | grep -E '^[A-Z][a-zA-Z0-9]*/' | cut -d'/' -f1 | sort -u || true)
          if [ -z "${CHANGED_COMPONENTS}" ]; then
            echo "No component directories have changed."
            exit 0
          fi

          FAIL=""
          for COMPONENT in ${CHANGED_COMPONENTS}; do
            if ! .github/backwards-compatibility-check.sh "${COMPONENT}" "${BASE_REF}"; then
              FAIL="true"
            fi
          done

          if [ "${FAIL}" = "true" ]; then
            exit 1
          fi
      # Reached only when the BC check above passed, so no breaks were detected.
      - name: "Check for BC label"
        if: github.event.pull_request.user.login != 'release-please[bot]'
        env:
          HAS_BC_LABEL: ${{ contains(github.event.pull_request.title, '!:') }}
        run: |
          if [[ "true" == "${HAS_BC_LABEL}" ]]; then
            echo "❌ Error: You indicated breaking changes in your PR title (!:), but no backwards compatibility breaks were detected by the automated check."
            exit 1
          fi

      # Release PRs are expected to contain breaking changes that have already
      # been approved and justified, so they are reported as an FYI comment
      # rather than failing the build.
      - name: "Report BC breaks against latest release"
        if: github.event.pull_request.user.login == 'release-please[bot]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "Github Actions"
          git config --global user.email "actions@github.com"

          BASE_REF=$(gh release view --json tagName --jq .tagName)
          echo "Comparing against latest release: ${BASE_REF}"

          CHANGED_COMPONENTS=$(git diff "${BASE_REF}" --name-only | grep -E '^[A-Z][a-zA-Z0-9]*/' | cut -d'/' -f1 | sort -u || true)

          # The script exits non-zero per component with breaks; here that is
          # expected, so only the report on stdout matters.
          : > bc-report.md
          for COMPONENT in ${CHANGED_COMPONENTS}; do
            BC_FORMAT=markdown .github/backwards-compatibility-check.sh "${COMPONENT}" "${BASE_REF}" >> bc-report.md || true
          done
      - name: "Comment BC breaks on release PR"
        if: github.event.pull_request.user.login == 'release-please[bot]'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- bc-breaking-changes -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const report = fs.readFileSync('bc-report.md', 'utf8').trim();

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number
            });
            const existing = comments.find(c => c.body.startsWith(marker));

            // Re-runs must clear a stale comment once the breaks are resolved.
            if (!report) {
              core.info('No BC breaks detected against the latest release.');
              if (existing) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
              }
              return;
            }

            const body = [
              marker,
              '## ⚠️ Backwards Compatibility Breaking Changes',
              '',
              'The following BC breaks were detected against the latest release. This is informational only and does not block the release.',
              '',
              report,
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # Ensure the release PR does not contain an unexpected (e.g. 2.0.0) major version release
  # Add "MAJOR_VERSION_ALLOWED=component1,component2" to the PR description to allow major version
  # releases for those components
  unexpected-major-version-check:
    name: Unexpected Major Version Check
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'release-please[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Parse allowed major versions
        uses: actions-ecosystem/action-regex-match@9e6c4fb3d5e898f505be7a1fb6e7b0a278f6665b # v2
        id: allowed-major-versions
        with:
          text: ${{ github.event.pull_request.body }}
          regex: '^MAJOR_VERSION_ALLOWED=(.*)$'
          flags: gm
      - name: "Check for unexpected major version"
        run: |
          # parse allowed major versions into an array
          IFS=', ' read -r -a ALLOWED_MAJOR_VERSIONS <<< "${STEPS_ALLOWED_MAJOR_VERSIONS_OUTPUTS_GROUP1}"
          # get all changed components
          COMPONENTS=$(git diff origin/main --name-only | grep VERSION | xargs dirname)
          FAIL=""
          for COMPONENT in ${COMPONENTS}; do {
            if [[ "$(cat $COMPONENT/VERSION)" == [123456789].0.0 ]]; then
              # A new version is being released - make sure it's allowed
              if [[ ${ALLOWED_MAJOR_VERSIONS[@]} =~ $COMPONENT ]]; then
                echo "Major version release allowed: $COMPONENT"
              else
                echo "Unexpected major version release found: $COMPONENT"
                FAIL="true"
              fi
            fi
          }; done
          if [[ "$FAIL" == "true" ]]; then
            echo "⚠️ IMPORTANT ⚠️ This check is meant to prevent the accidental release of new major versions. New "
            echo "major versions should only be released intentionally. If you are not explicitly trying to release a "
            echo "new major version and you don't have explicit approval from the Language Lead, "
            echo "⚠️ DO NOT BYPASS THIS CHECK ⚠️"
            echo -e "\nAdd \"MAJOR_VERSION_ALLOWED=component1,component2\" to the PR description to allow "
            echo "major version releases for those components"
            exit 1
          fi
        env:
          STEPS_ALLOWED_MAJOR_VERSIONS_OUTPUTS_GROUP1: ${{ steps.allowed-major-versions.outputs.group1 }}

  next-release-label-check:
    name: Check for "next release" label
    uses: GoogleCloudPlatform/php-tools/.github/workflows/release-checks.yml@8d707553d2c90c3b614941950814dcc10c19ce47 # main
    if: github.event.pull_request.user.login == 'release-please[bot]'
    with:
      next-release-label-check: true

  # Ensure all repos are in compliance
  repo-compliance-check:
    name: Repo Compliance Check
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'release-please[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: "Install PHP"
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
      - name: "Install dependencies"
        run: composer install -d dev
      - name: "Check repo compliance"
        env:
          GH_TOKEN: ${{ secrets.SPLIT_TOKEN }}
          PG_TOKEN: ${{ secrets.PACKAGIST_SAFE_TOKEN }}
        run: |
          ./dev/google-cloud repo:compliance \
            --format=ci  \
            -t $GH_TOKEN \
            -p $PG_TOKEN \
            --skip Gax:repo \
            --skip Auth:repo \
            --skip Jwt:repo # Skip repo check for Gax, Auth, and Jwt because issues are enabled on those repos
