on:
  release:
    types: [published]
  pull_request:
    paths:
      - 'PubSub/**'
      - '.github/workflows/emulator-system-tests-pubsub.yaml'
      - '.github/emulator/**'
name: Emulator System Tests
permissions:
  contents: read
  issues: write
jobs:
  test:
    name: PubSub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - run: ./.github/emulator/start-emulator.sh pubsub

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          tools: pecl
          extensions: grpc

      - name: Install dependencies
        run: |
          composer config minimum-stability dev -d PubSub/
          composer config repositories.local path "../Core" -d PubSub
          composer require "google/cloud-core:*" -d PubSub/

      - name: Run system tests
        run: |
          PubSub/vendor/bin/phpunit -c PubSub/phpunit-system.xml.dist --exclude-group gapic
        env:
          PUBSUB_EMULATOR_HOST: localhost:8085
          PROJECT_ID: my-project-id
          GOOGLE_CLOUD_PHP_TESTS_KEY_PATH: '.github/emulator/example-key.json'
          GOOGLE_CLOUD_PHP_WHITELIST_TESTS_KEY_PATH: '.github/emulator/example-key.json'
      - name: Create issue if previous step fails
        if: ${{ failure() && github.event_name == 'release' }}
        uses: googleapis/librarian/.github/actions/create-issue-on-failure@45ada77d3adcdf7f54e94b5ea674a5fa48cb6a75 # v0.46.0
        with:
          title: "PubSub Emulator System Tests check failed on release"
          body: |
            The `Emulator System Tests (PubSub)` post-release check failed on `${{ github.ref_name }}`.

            Please check the logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          mention: "@googleapis/cloud-sdk-php-team"
