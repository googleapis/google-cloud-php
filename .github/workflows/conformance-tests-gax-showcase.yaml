name: Run GAX Conformance Tests With Showcase
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  gapic-showcase:
    name: GAPIC Showcase Conformance Tests
    runs-on: ubuntu-latest
    env:
      GAPIC_SHOWCASE_VERSION: 0.44.0
      OS: linux
      ARCH: amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup cache environment
        id: extcache
        uses: shivammathur/cache-extensions@de3c642a5fce0ef91581a1c9831e229f525196d6 # v1
        with:
          php-version: '8.2'
          extensions: grpc
          key: cache-key-1 # increment to bust the cache

      - name: Cache extensions
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.extcache.outputs.dir }}
          key: ${{ steps.extcache.outputs.key }}
          restore-keys: ${{ steps.extcache.outputs.key }}

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          extensions: grpc

      # PQC (X25519MLKEM768) requires the BoringSSL bundled in grpc >= 1.83.0.
      - name: Verify grpc version
        run: |
          php -r 'if (version_compare(phpversion("grpc"), "1.83.0", "<")) { fwrite(STDERR, sprintf("grpc %s is older than the 1.83.0 required for PQC\n", phpversion("grpc"))); exit(1); }'

      - name: Install and run GAPIC Showcase
        run: |
          curl -L https://github.com/googleapis/gapic-showcase/releases/download/v${GAPIC_SHOWCASE_VERSION}/gapic-showcase-${GAPIC_SHOWCASE_VERSION}-${OS}-${ARCH}.tar.gz | tar -zx
          ./gapic-showcase run --port :7469 --tls --ca-cert-output-file Gax/tests/Conformance/showcase.pem &
          sleep 2

      - name: Install dependencies
        run: |
          composer update --prefer-dist --no-interaction --no-suggest -d Gax/

      - name: Run PHPUnit
        run: Gax/vendor/bin/phpunit -c Gax/phpunit-conformance.xml.dist
