name: DocFX Test Suite
on:
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  docfx:
    name: "Run DocFX tests"
    runs-on: ubuntu-latest
    env:
      PHPDOC_ENV: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.15'
      - run: pip install --require-hashes -r .kokoro/docs/docker/requirements.txt
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.2"
      - name: Extract phpDocumentor
        id: extract
        uses: shrink/actions-docker-extract@f1ef61065b78731fe3310b4e84e511f6a927a77e # v4
        with:
          image: "phpdoc/phpdoc:3.5.3"
          path: "/opt/phpdoc/."
      - name: Symlink phpDocumentor
        run: ln -s $(pwd)/${STEPS_EXTRACT_OUTPUTS_DESTINATION}/bin/phpdoc /usr/local/bin/phpdoc
        env:
          STEPS_EXTRACT_OUTPUTS_DESTINATION: ${{ steps.extract.outputs.destination }}
      - name: Install Dependencies
        uses: nick-invision/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: composer --no-interaction --no-ansi --no-progress update -d dev
      - name: Run DocFX Unit Test Suite
        run: dev/vendor/bin/phpunit -c dev/phpunit-docfx.xml.dist
      - name: Install Dependencies (--no-dev)
        uses: nick-invision/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: composer --no-interaction --no-ansi --no-progress --no-dev update -d dev
      - name: Run Docs Generator (Dry Run)
        run: .kokoro/docs/publish.sh
      - name: Create issue if previous step fails
        if: ${{ failure() && github.event_name == 'release' }}
        uses: googleapis/librarian/.github/actions/create-issue-on-failure@45ada77d3adcdf7f54e94b5ea674a5fa48cb6a75 # v0.46.0
        with:
          title: "DocFX Test Suite check failed on release"
          body: |
            The `DocFX Test Suite` post-release check failed on `${{ github.ref_name }}`.

            Please check the logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          mention: "@googleapis/cloud-sdk-php-team"
