on:
  release:
    types: [published]
  pull_request:
    paths:
      - 'Datastore/**'
      - '.github/workflows/emulator-system-tests-datastore.yaml'
      - '.github/emulator/**'
name: Emulator System Tests
permissions:
  contents: read
  issues: write
jobs:
  test:
    name: Datastore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - run: ./.github/emulator/start-emulator.sh datastore 581.0.0-emulators

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          tools: pecl
          extensions: grpc

      - name: Install dependencies
        run: |
          composer config minimum-stability dev -d Datastore/
          composer config repositories.local path "../Core" -d Datastore
          composer require "google/cloud-core:*" -d Datastore/

      - name: Run system tests
        run: |
          Datastore/vendor/bin/phpunit -c Datastore/phpunit-system.xml.dist
        env:
          DATASTORE_EMULATOR_HOST: localhost:8085
          GOOGLE_CLOUD_PHP_TESTS_KEY_PATH: '.github/emulator/example-key.json'
          GOOGLE_CLOUD_PHP_WHITELIST_TESTS_KEY_PATH: '.github/emulator/example-key.json'
      - name: Create issue if previous step fails
        if: ${{ failure() && github.event_name == 'release' }}
        uses: googleapis/librarian/.github/actions/create-issue-on-failure@45ada77d3adcdf7f54e94b5ea674a5fa48cb6a75 # v0.46.0
        with:
          title: "Datastore Emulator System Tests check failed on release"
          body: |
            The `Emulator System Tests (Datastore)` post-release check failed on `${{ github.ref_name }}`.

            Please check the logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          mention: "@googleapis/cloud-sdk-php-team"
