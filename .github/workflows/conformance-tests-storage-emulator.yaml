on:
  release:
    types: [published]
  pull_request:
    paths:
      - 'Storage/**'
      - '.github/workflows/conformance-tests-storage-emulator.yaml'
name: Run Storage Retry Conformance Tests With Emulator
permissions:
  contents: read
  issues: write
jobs:
  test:
    runs-on: 'ubuntu-26.04'

    services:
      emulator:
        image: gcr.io/cloud-devrel-public-resources/storage-testbench:v0.66.0@sha256:a00248e6b5ae8365030285fc0aa3c989611adbac8ca4b96c5b668e9fc9f4d5e4
        ports:
          - 9000:9000

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: |
          composer update --prefer-dist --no-interaction --no-suggest

      - name: Run storage retry conformance tests
        run: |
          vendor/bin/phpunit -c Storage/phpunit-conformance.xml.dist
        env:
          STORAGE_EMULATOR_HOST: http://localhost:9000
      - name: Create issue if previous step fails
        if: ${{ failure() && github.event_name == 'release' }}
        uses: googleapis/librarian/.github/actions/create-issue-on-failure@45ada77d3adcdf7f54e94b5ea674a5fa48cb6a75 # v0.46.0
        with:
          title: "Storage Retry Conformance Tests check failed on release"
          body: |
            The `Run Storage Retry Conformance Tests With Emulator` post-release check failed on `${{ github.ref_name }}`.

            Please check the logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          mention: "@googleapis/cloud-sdk-php-team"
