on:
  release:
    types: [published]
  pull_request:
    paths:
      - 'Storage/**'
      - '.github/workflows/conformance-tests-storage-emulator.yaml'
name: Run Storage Retry Conformance Tests With Emulator
permissions:
  contents: read
jobs:
  test:
    name: "Conformance Tests: Storage Retry"
    runs-on: 'ubuntu-26.04'

    services:
      emulator:
        image: gcr.io/cloud-devrel-public-resources/storage-testbench:v0.67.0@sha256:06729d407e8bba055798707dccfffd1f792ea818937954c56a776811116ede5c
        ports:
          - 9000:9000

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: |
          composer update --prefer-dist --no-interaction --no-suggest

      - name: Run storage retry conformance tests
        run: |
          vendor/bin/phpunit -c Storage/phpunit-conformance.xml.dist
        env:
          STORAGE_EMULATOR_HOST: http://localhost:9000
