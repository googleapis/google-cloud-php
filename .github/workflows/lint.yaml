name: CS Test Suite
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  style_phpcs:
    runs-on: ubuntu-latest
    name: PHP Style Check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
      - name: Install Dependencies
        run: composer global require "squizlabs/php_codesniffer:3.*"
      - name: Run PHPCS Code Style Checker
        run: ~/.composer/vendor/bin/phpcs --standard=phpcs-ruleset.xml -p

  style_csfixer:
    name: PHP CS Fixer
    uses: GoogleCloudPlatform/php-tools/.github/workflows/code-standards.yml@8d707553d2c90c3b614941950814dcc10c19ce47 # main
    with:
      config: GoogleCloudPlatform/php-tools/.php-cs-fixer.default.php@main
      exclude-patterns: |
        [
          "#.*/src/V[0-9]+#",
          "#.*/src/.*/V[0-9]+#",
          "#.*/(tests|samples|metadata)#",
          "vendor",
          "dev",
          "docs",
          "AccessContextManager/src/Type",
          "Asset/external",
          "BigQueryDataExchange/src/Common",
          "CommonProtos",
          "Core/src/Testing",
          "GSuiteAddOns/external",
          "OsLogin/src/Common",
          "LongRunning/src/ApiCore/LongRunning",
          "LongRunning/src/LongRunning",
          "Translate/src/Connection",
          "Translate/src/TranslateClient.php"
        ]

  staticanalysis:
    runs-on: ubuntu-latest
    name: PHPStan Static Analysis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
      - name: "Install dependencies"
        run: |
          composer --no-interaction --no-ansi --no-progress update
          composer --no-interaction --no-ansi --no-progress update -d dev
      - name: Run Static Analysis
        run: |
          dev/sh/static-analysis
  tidy-check:
    runs-on: ubuntu-latest
    name: Verify librarian.yaml is tidy
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      # Version of librarian is pulled from librarian.yaml,
      # action is pinned to commit SHA to satisfy blanket security policy.
      - uses: googleapis/librarian@35997441eafc2b02716804f9baba1e3f04f8a44f # v0.31.1
      - name: Run librarian tidy
        run: librarian tidy
      - name: Check for diff
        run: |
          if ! git diff --exit-code; then
            V=$(librarian config get version 2>/dev/null || echo "latest")
            echo "librarian.yaml is not tidy. Please run:"
            echo ""
            echo "  librarian tidy"
            echo ""
            echo "to tidy librarian.yaml and commit the changes."
            exit 1
          fi