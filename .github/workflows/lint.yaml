name: CS Test Suite
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  style_phpcs:
    runs-on: ubuntu-latest
    name: PHP Style Check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
      - name: Install Dependencies
        run: composer global require "squizlabs/php_codesniffer:3.*"
      - name: Run PHPCS Code Style Checker
        run: ~/.composer/vendor/bin/phpcs --standard=phpcs-ruleset.xml -p

  style_csfixer:
    runs-on: ubuntu-latest
    name: PHP CS Fixer / PHP Code Standards
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
      - name: Install Dependencies
        run: composer global require "friendsofphp/php-cs-fixer:^3.0"
      - name: Run PHP CS Fixer
        run: ~/.composer/vendor/bin/php-cs-fixer fix --dry-run --diff

  staticanalysis:
    runs-on: ubuntu-latest
    name: PHPStan Static Analysis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
      - name: "Install dependencies"
        run: |
          composer --no-interaction --no-ansi --no-progress update
          composer --no-interaction --no-ansi --no-progress update -d dev
      - name: Run Static Analysis
        run: |
          dev/sh/static-analysis
  tidy-check:
    runs-on: ubuntu-latest
    name: Verify librarian.yaml is tidy
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Version of librarian is pulled from librarian.yaml,
      # action is pinned to commit SHA to satisfy blanket security policy.
      - uses: googleapis/librarian@45ada77d3adcdf7f54e94b5ea674a5fa48cb6a75 # v0.46.0
      - name: Run librarian tidy
        run: librarian tidy
      - name: Check for diff
        run: |
          if ! git diff --exit-code; then
            V=$(librarian config get version 2>/dev/null || echo "latest")
            echo "librarian.yaml is not tidy. Please run:"
            echo ""
            echo "  librarian tidy"
            echo ""
            echo "to tidy librarian.yaml and commit the changes."
            exit 1
          fi

  composer-audit:
    runs-on: ubuntu-latest
    name: Composer Audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
      - name: Install dependencies
        run: |
          composer --no-interaction --no-ansi --no-progress update
          composer --no-interaction --no-ansi --no-progress update -d dev
      - name: Audit dependencies
        run: |
          composer audit --abandoned=fail
          composer audit --abandoned=fail -d dev